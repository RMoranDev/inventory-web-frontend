<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory</title>
    <link rel="shortcut icon" href="assets/images/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>

        <section class="login-container">
            
            <header>
                <span class="brand-title">Inventory Web</span>
                <h1 class="main-heading">Entar</h1>
                <p class="subtitle">Acesse o controle de estoque</p>
            </header>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                        > 
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input 
                        type="text" 
                        id=""
                        name=""
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required 
                    >
                </div>

                <button type="submit" class="btn-submit">Entrar</button>

                <div>
                    <a href="#" class="forgot-link">Esqueci minha senha</a>
                </div>

                <div class="visitor-container">
                    <a href="pages/home.html" class="btn-visitor">Entrar como visitante</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
